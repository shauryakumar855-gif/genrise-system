<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — GenRise</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span>Gen</span><b>Rise</b><small>LEARN • EARN • GROW</small></a><nav><a href="index.html">Home</a><a href="index.html#opportunities">Opportunities</a><a href="#" id="logout">Logout</a></nav></header><main class="dashboard"><div class="dashTop"><div><p class="eyebrow">STUDENT DASHBOARD</p><h1 id="welcome">Welcome</h1><p class="muted">Your saved GenRise opportunities.</p></div><button class="outline" id="logout2">Logout</button></div><div id="saved" class="cards"><p>Loading…</p></div></main><script>async function init(){const me=await fetch('/api/me').then(r=>r.json());if(!me.user){location.href='login.html';return}welcome.textContent='Welcome, '+me.user.name+' 👋';const d=await fetch('/api/my-opportunities').then(r=>r.json());saved.innerHTML=d.opportunities.length?d.opportunities.map(o=>`<article class="card"><div class="icon">${o.category==='Learning'?'📚':o.category==='Projects'?'💻':o.category==='Competitions'?'🏆':'🎯'}</div><h3>${o.title}</h3><p>${o.description}</p><div class="meta">${o.category} · ${o.deadline||''}</div></article>`).join(''):'<p>You have not saved any opportunities yet. <a href="index.html#opportunities" style="color:#a2760e;font-weight:700">Explore opportunities →</a></p>'}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='index.html'}document.getElementById('logout').onclick=e=>{e.preventDefault();logout()};document.getElementById('logout2').onclick=logout;init();</script></body></html>
