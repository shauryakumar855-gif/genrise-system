<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up — GenRise</title><link rel="stylesheet" href="style.css"></head><body><main class="formPage"><div class="formCard"><a class="brand" href="index.html"><span>Gen</span><b>Rise</b><small>LEARN • EARN • GROW</small></a><br><br><h1>Create account</h1><p>Join GenRise and start discovering opportunities.</p><form id="signupForm"><label>Name</label><input name="name" required autocomplete="name"><label>Email</label><input type="email" name="email" required autocomplete="email"><label>Password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><button>Create Account</button><div class="message" id="message"></div></form><p class="switch">Already have an account? <a href="login.html">Login</a></p></div></main><script>signupForm.onsubmit=async e=>{e.preventDefault();message.textContent='';const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(signupForm)))});const d=await r.json();if(r.ok)location.href='dashboard.html';else message.textContent=d.error||'Signup failed.'}</script></body></html>
