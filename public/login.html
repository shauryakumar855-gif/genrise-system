<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — GenRise</title><link rel="stylesheet" href="style.css"></head><body><main class="formPage"><div class="formCard"><a class="brand" href="index.html"><span>Gen</span><b>Rise</b><small>LEARN • EARN • GROW</small></a><br><br><h1>Welcome back</h1><p>Log in to your GenRise student account.</p><form id="loginForm"><label>Email</label><input type="email" name="email" required autocomplete="email"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button>Login</button><div class="message" id="message"></div></form><p class="switch">New to GenRise? <a href="signup.html">Create an account</a></p></div></main><script>loginForm.onsubmit=async e=>{e.preventDefault();message.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))});const d=await r.json();if(r.ok)location.href='dashboard.html';else message.textContent=d.error||'Login failed.'}</script></body></html>
